[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "henxels"
version = "0.9.1"
description = "A repo-level harness for coding agents — file-level structure constraints that keep every agent true to your repo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "benquemax" }]
keywords = ["harness", "agent-harness", "coding-agent", "structure", "contract", "agents", "ai", "lint", "guardrails", "pre-commit", "validation", "llm-wiki", "okf", "open-knowledge-format", "knowledge-base", "agents-md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/benquemax/henxels"
Repository = "https://github.com/benquemax/henxels"
Issues = "https://github.com/benquemax/henxels/issues"

[project.optional-dependencies]
# Enables the `markdown_lint` statement.
markdown = ["pymarkdownlnt>=0.9"]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "pymarkdownlnt>=0.9",
]

[project.scripts]
henxels = "henxels.cli:main"

[tool.setuptools.packages.find]
include = ["henxels*"]

[tool.setuptools.package-data]
henxels = ["schema/*.json"]
"henxels.integrations" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: end-to-end journeys driving the real henxels binary in a sandbox (deselect with -m 'not e2e')",
    "packaging: E2E against distributed artifacts (real downloads/installs; network required)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is advisory; the formatter handles wrapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"henxels/__init__.py" = ["F401"]
"henxels/statements/__init__.py" = ["F401"]

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.md013.enabled = false
plugins.md025.enabled = false
