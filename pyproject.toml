[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "henxels"
version = "0.2.0"
description = "External structure that gives shape to your project — keep your ADHD agent in henxels"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.scripts]
henxels = "henxels.cli:main"

[tool.setuptools.packages.find]
include = ["henxels*"]

[tool.setuptools.package-data]
henxels = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is advisory; the formatter handles wrapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"henxels/__init__.py" = ["F401"]
"henxels/statements/__init__.py" = ["F401"]
