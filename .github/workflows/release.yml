# Release henxels to PyPI + npm when a version tag is pushed.
#
#   git tag v0.5.1 && git push origin v0.5.1
#
# Bump BOTH pyproject.toml and npm/package.json to the same version before tagging;
# the `verify` job fails the release if the tag and the two files disagree.
#
# ── One-time setup (web UI; no tokens — both use OIDC Trusted Publishing) ─────
#   PyPI:  pypi.org → henxels → Manage → Publishing → Add a GitHub publisher:
#       owner = benquemax · repo = henxels · workflow = release.yml · environment = (blank)
#   npm:   npmjs.com → henxels → Settings → Trusted Publisher → GitHub Actions:
#       org/user = benquemax · repository = henxels · workflow filename = release.yml
#       environment = (blank) · allowed action = Allow npm publish
# ─────────────────────────────────────────────────────────────────────────────

name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches pyproject + npm versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NPM=$(grep -m1 '"version"' npm/package.json | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  pyproject=$PY  npm=$NPM"
          { [ "$TAG" = "$PY" ] && [ "$TAG" = "$NPM" ]; } || {
            echo "::error::version mismatch — tag=$TAG pyproject=$PY npm=$NPM"; exit 1; }

  # Nothing reaches a registry unless the FULL battery passes on the tagged commit:
  # units, E2E journeys, and the packaging cold start (real npm tarball + engine
  # bootstrap). CI running on the branch is not enough — this is the release's own gate.
  tests:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run henxels check --all

  pypi:
    needs: [verify, tests]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing (no token needed)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # After pypi, never in parallel: the npm launcher runs the engine pinned to its own
    # version, so the PyPI release must exist before anyone can npm-install this one.
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm Trusted Publishing (no token) + provenance
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Intentionally NO registry-url: it writes an .npmrc with an empty
          # NODE_AUTH_TOKEN + always-auth, which makes npm attempt (failed) token auth
          # instead of OIDC trusted publishing — surfacing as a 404 on publish. npm
          # defaults to registry.npmjs.org anyway.
      - name: Use an npm new enough for trusted publishing
        run: |
          npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
          node --version
          npm --version               # confirm it's >= 11.5.1 in the logs
      - name: Publish launcher
        working-directory: npm
        # No token and no --provenance: OIDC trusted publishing authenticates and
        # attaches provenance automatically (id-token: write above).
        run: npm publish --access public

  # The release isn't green until a stranger's install works: fresh runner, install the
  # JUST-PUBLISHED npm package, let the launcher bootstrap its engine, use it for real.
  smoke:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for both registries to serve the new version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 36); do
            npm view "henxels@$VERSION" version >/dev/null 2>&1 && break; sleep 5; done
          for i in $(seq 1 36); do
            curl -fsS "https://pypi.org/pypi/henxels/$VERSION/json" >/dev/null 2>&1 && break; sleep 5; done
      - name: Fresh npm install runs end to end
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm install -g "henxels@$VERSION"
          # Captured, not piped straight to `grep -q`: under this shell's default
          # pipefail, grep closing the pipe the instant it matches can SIGPIPE a
          # still-flushing producer (a real, if racy, failure we hit on 0.8.0's
          # release). Capturing first means henxels has already exited before grep
          # ever runs, so there's no live pipe left to break.
          OUTPUT="$(henxels catalogue)"
          echo "$OUTPUT" | grep -q filename_casing
          mkdir demo && cd demo && git init -q
          git config user.email smoke@example.com && git config user.name Smoke
          henxels init --template okf-llm-wiki
          henxels check --all
