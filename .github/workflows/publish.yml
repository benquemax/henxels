# Publish henxels to PyPI (Python engine) and npm (node launcher).
#
# Runs only on a published GitHub Release (or manual dispatch). Before the first run:
#   • PyPI: create the project, then add a Trusted Publisher for this repo/workflow
#           (no token needed — OIDC). https://docs.pypi.org/trusted-publishers/
#   • npm:  create the package, add an automation token as the NPM_TOKEN secret
#           (or configure npm Trusted Publishing / OIDC).
# The package name `henxels` must be available on each registry.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish launcher to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
