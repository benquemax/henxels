# henxels.yaml — henxels' own contract. A whiteboard list of rules; we eat our own dog food.
# Change a rule here to change the rules; that's the only way to disobey responsibly.
# yaml-language-server: $schema=./henxels/schema/henxels.schema.json

settings:
  ask_me_before_staging: true     # the maintainer stages and pushes himself
  confirm_before_push: true       # block `git push` until `henxels bless push`
  confirm_before_deleting:        # losing files / many lines must be deliberate
    over_lines: 5
  warn_about_similar_files:
    above: 0.85
    ignore: ["**/__init__.py", "tests/**", "integrations/**"]
  judge:                          # there IS a judge for the natural-language henxels…
    api_key_env: HENXELS_JUDGE_KEY        # …but WHERE it lives is the machine's business:
    timeout: 300                          # HENXELS_JUDGE_URL / _MODEL / _EXTRA_BODY in your shell
                                          # override the defaults (a local Ollama). No endpoint
                                          # reachable? It warns "could not be judged" and moves on.

henxels:
  - henxel: "The package code is snake_case (including subpackages)"
    in: ./henxels/*               # the * makes it recursive
    filename_casing: snake_case

  - henxel: "Tests are snake_case and live in tests/"
    in: ./tests/*
    filename_casing: snake_case

  - henxel: "Docs are kebab-case markdown, each with a title and summary"
    in: ./docs                    # direct files in docs/ (no asterisk)
    allowed_filetypes: .md
    filename_casing: kebab-case
    required_frontmatter: [title, summary]
    markdown_lint: true           # pymarkdownlnt; rules tuned in [tool.pymarkdown]

  - henxel: "Project config lives only in pyproject.toml"
    forbidden_files: [setup.py, setup.cfg]   # no `in:` = whole repo

  - henxel: "Statements stay merge-ready (every one has a help= and a test)"
    well_formed_statements: true             # dogfood the contribution quality bar

  - henxel: "README links are absolute (it's the long-description on PyPI and npm)"
    in: ./README.md
    markdown_links_absolute: true

  - henxel: "The scratch folder must exist"
    required_files: _temp/.gitkeep

  - henxel: "The parking lot should exist (gitignored — only a reminder)"
    why: >
      Check it before planning any new work — it may already flag a known
      imperfection, a planned deprecation, or something overlapping the
      task, and building more onto something already marked for removal
      wastes the work twice.
    required_files: _todo.md
    level: warn
    run_before_commit: git check-ignore -q _todo.md

  - henxel: "Code is clean and conventional (ruff) before every commit"
    run_before_commit: "uv run ruff check ."

  - henxel: "The test suite passes before every commit"
    run_before_commit: "uv run pytest -q -m 'not e2e'"   # fast tier; journeys gate the push

  - henxel: "The contract holds before every push"
    run_before_push: "uv run henxels check --all"

  - henxel: "The end-to-end journeys pass before every push"
    run_before_push: 'uv run pytest -q -m "e2e and not packaging"'   # packaging = network/downloads; CI + release territory

  - henxel: "Behaviour changes update the docs"
    changed_with:                  # a commit-time reminder; only fires when relevant
      when: henxels/**             # if package code is staged...
      expect: [docs/**, README.md, AGENTS.md]   # ...so should the docs
    level: warn

  - henxel: "A changed behaviour is described in the docs, not merely touched"
    why: >
      changed_with only sees that a doc file moved; only a reader can tell whether
      it now says the new thing. This one asks a model. A doc that lies is worse
      than no doc.
    in: [./henxels/*, ./docs/*, ./README.md]
    make_sure_that: true           # the judge in settings: reads the staged diff
    level: warn                    # a judge is fallible; awareness beats blocking
