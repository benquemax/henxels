# henxels.yaml — henxels' own contract. A whiteboard list of rules; we eat our own dog food.
# Change a rule here to change the rules; that's the only way to disobey responsibly.
# yaml-language-server: $schema=https://raw.githubusercontent.com/benquemax/henxels/main/henxels/schema/henxels.schema.json

settings:
  ask_me_before_staging: true     # the maintainer stages and pushes himself
  confirm_before_push: true       # block `git push` until `henxels bless push`
  confirm_before_deleting:        # losing files / many lines must be deliberate
    over_lines: 5
  warn_about_similar_files:
    above: 0.85
    ignore: ["**/__init__.py", "tests/**"]

henxels:
  - henxel: "The package code is snake_case"
    in: henxels
    casing: snake_case

  - henxel: "Tests are snake_case and live in tests/"
    in: tests
    casing: snake_case

  - henxel: "Docs are kebab-case markdown, each with a title and summary"
    in: docs
    files_are: .md
    casing: kebab-case
    frontmatter_has: [title, summary]

  - henxel: "Project config lives only in pyproject.toml"
    forbidden_files: [setup.py, setup.cfg]

  - henxel: "The scratch folder must exist"
    required_files: _temp/.gitkeep

  - henxel: "The parking lot should exist (gitignored — only a reminder)"
    required_files: _todo.md
    level: warn

  - henxel: "Code is clean and conventional (ruff) before every commit"
    run_before_commit: "uv run ruff check ."

  - henxel: "The test suite passes before every commit"
    run_before_commit: "uv run pytest -q"

  - henxel: "The contract holds before every push"
    run_before_push: "uv run henxels check --all"
